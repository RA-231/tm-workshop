# Workshop task runner — https://taskfile.dev
# `task --list` shows everything; docs/ tells you when to run what.
version: '3'

tasks:
  setup:
    desc: Create .env and the local data directories
    cmds:
      - mkdir -p data/raw
      - cp -n .env.example .env || true
      - echo "ready — edit .env when you receive the workshop AWS credential"

  data:download:
    desc: "Download the ESA dataset: task data:download -- [small|medium|full]"
    cmds:
      - python3 scripts/fetch_esa_adb.py {{.CLI_ARGS | default "small"}}

  up:docs:
    desc: Build + serve the docs site and service landing page (http://localhost:4321)
    cmds:
      - docker compose up -d --build docs
      - echo "docs + service links -> http://localhost:4321"

  slides:
    desc: Serve the presenter slide deck (http://localhost:4321/slides/)
    cmds:
      # The deck is a static file under site/public, so the docs service serves it.
      - docker compose up -d --build docs
      - echo "slides -> http://localhost:4321/slides/   (press ? for controls, p for presenter view)"

  up:ingest:
    desc: Start the ingest stack (Garage, Polaris + Postgres, Flink)
    cmds:
      # Polaris pulls in its Postgres + one-shot bootstrap via depends_on.
      - docker compose up -d --build garage polaris flink-jobmanager flink-taskmanager
      - bash scripts/init-garage.sh

  data:prepare:
    desc: Convert the pickled ESA channels into JSON for Flink to read
    cmds:
      - docker compose run --rm --build prepare

  catalog:create:
    desc: Create the 'workshop' catalog in Polaris
    cmds:
      - bash scripts/create-catalog.sh

  flink:load:
    internal: true
    # The SQL carries ${RUN_ID} / ${INGEST_TS} / ${INGEST_MODE} placeholders for
    # the provenance columns. envsubst renders them in the container before the
    # SQL client sees the file, so every row of one load shares one value —
    # CURRENT_TIMESTAMP would be evaluated per record instead. The explicit
    # variable list keeps envsubst away from any other $ in the SQL.
    vars:
      RUN_ID:
        sh: date -u +%Y%m%dT%H%M%SZ
      INGEST_TS:
        sh: date -u +"%Y-%m-%d %H:%M:%S.000"
      INGEST_MODE: streaming
    cmds:
      # Metadata-only drop through the catalog REST API. Flink's own DROP TABLE
      # always demands a purge, and Polaris deleting ~900 files in the
      # background starves its S3 pool while this load is still committing.
      - bash scripts/drop-tables.sh
      - for: [ingest.sql, metadata.sql]
        cmd: >-
          docker compose exec -T
          -e RUN_ID='{{.RUN_ID}}'
          -e INGEST_TS='{{.INGEST_TS}}'
          -e INGEST_MODE='{{.INGEST_MODE}}'
          flink-jobmanager
          bash -c 'envsubst "\${RUN_ID} \${INGEST_TS} \${INGEST_MODE}"
          < /opt/flink/sql/{{.ITEM}} > /tmp/{{.ITEM}}
          && bin/sql-client.sh -f /tmp/{{.ITEM}}'

  flink:job:
    desc: Load readings + metadata tables into Iceberg (Flink SQL)
    # No-op once the tables are in the catalog. The load SQL drops and
    # re-creates them, and Polaris purges the old data files in the background
    # — which stalls every catalog call for minutes. Use `task flink:reload`
    # to redo the load on purpose.
    status:
      - bash scripts/tables-loaded.sh
    cmds:
      - task: flink:load

  flink:reload:
    desc: Drop and re-load the Iceberg tables from scratch
    prompt: This re-creates the tables. Polaris purges the old data files in the background, which slows catalog operations for a few minutes. Continue?
    cmds:
      - task: flink:load

  trino:views:
    desc: Create the Trino views (enriched readings, anomalies, labeled_readings)
    cmds:
      - docker compose exec -T trino trino --catalog iceberg --schema esa_adb -f /etc/trino/views.sql

  trino:optimize:
    desc: (Optional) Compact the small files the streaming load leaves behind
    cmds:
      - docker compose exec -T trino trino --catalog iceberg --schema esa_adb -f /etc/trino/optimize.sql

  up:query:
    desc: Start the query stack (Trino, Superset)
    cmds:
      - docker compose up -d --build --wait trino superset

  superset:dataset:
    desc: (Re)register the esa_adb.readings dataset in Superset
    cmds:
      - docker compose exec -T superset python /app/register_dataset.py

  trino:
    desc: Open an interactive Trino SQL session
    interactive: true
    cmds:
      - docker compose exec trino trino --catalog iceberg --schema esa_adb

  rowcount:
    desc: Count the rows ingested so far
    cmds:
      - docker compose up -d --wait trino
      - docker compose exec -T trino trino --execute "SELECT count(*) AS rows FROM iceberg.esa_adb.readings"

  llm:check:
    desc: Validate your model credential and list the models it can reach (read-only)
    cmds:
      - bash scripts/llm-check.sh

  up:chat:
    desc: Start the chat stack (Postgres, LiteLLM, MongoDB, LibreChat)
    cmds:
      # Discover which models this key can reach before starting the gateway.
      - python3 scripts/render-litellm-config.py
      - docker compose up -d litellm-postgres litellm mongodb librechat
      - echo "LibreChat -> http://localhost:3080  (register any account)"
      - echo "LiteLLM dashboard -> http://localhost:4000/ui  (log in as admin, password = LITELLM_MASTER_KEY from your .env)"

  keys:models:
    desc: "Facilitator: list the models the workshop project can reach"
    cmds:
      - ./scripts/admin/list-models.sh --check

  keys:mint:
    desc: "Facilitator: mint one key per seat (SEATS=50 by default)"
    cmds:
      - ./scripts/admin/mint-attendee-keys.sh --seats ${SEATS:-50}
      - ./scripts/admin/make-handouts.py
      - echo "Cards in handouts/. AirDrop handouts/phone.html to your co-facilitator."

  keys:reset:
    desc: "Facilitator: delete the existing seats and mint fresh ones (SEATS=50)"
    cmds:
      # Mint skips names that already exist, so a re-mint has to delete first.
      - ./scripts/admin/delete-attendee-keys.sh
      - ./scripts/admin/mint-attendee-keys.sh --seats ${SEATS:-50}
      - ./scripts/admin/make-handouts.py
      - echo "Fresh cards in handouts/. The previous ones no longer work."

  keys:dryrun:
    desc: "Facilitator: rehearse the whole mint -> cards flow with 3 keys that die in an hour"
    cmds:
      # A separate prefix so these never collide with the real tmws-NN seats, and
      # a one-hour cutoff so the keys expire on their own if cleanup is forgotten.
      - ./scripts/admin/list-models.sh --check
      - ./scripts/admin/mint-attendee-keys.sh
          --seats 3 --prefix dryrun
          --cutoff "$(date -u -v+1H +%Y-%m-%dT%H:%M:%S+00:00)"
          --out dryrun-keys.csv
      - ./scripts/admin/make-handouts.py --csv dryrun-keys.csv --out handouts-dryrun
      # silent: task would otherwise echo the whole heredoc before running it,
      # printing these instructions twice.
      - cmd: |
          cat <<'NOTE'

          Rehearsal minted 3 keys, expiring in one hour.

          Check by hand, in this order:
            1. handouts-dryrun/seat-01.png  -- open it on your phone
            2. http://localhost:4321/creds  -- Start camera, hold the QR up
                                               (task up:docs first if it is not running)
            3. paste the two lines it decodes into .env
            4. task llm:check               -- should list the models and say "ok"
            5. task up:chat                 -- then say hello in LibreChat

          Clean up when done:
            rm -rf dryrun-keys.csv handouts-dryrun
            delete the three dryrun-NN service accounts in the provider dashboard
            (their keys expire on their own; this just tidies the list)
          NOTE
        silent: true

  up:mcp:
    desc: Build + start the three MCP servers (esa-adb, trino, superset) and reload LibreChat
    cmds:
      - docker compose up -d --build mcp-server trino-mcp superset-mcp
      - docker compose restart librechat
      - echo "enable the esa-adb / trino / superset MCP servers in the agent's Tools menu"

  up:
    desc: Start the entire stack (all steps)
    cmds:
      - python3 scripts/render-litellm-config.py
      - docker compose up -d --build
      - bash scripts/init-garage.sh

  down:
    desc: Stop all containers (data survives)
    cmds:
      - docker compose --profile tools down

  clean:
    desc: Stop everything and delete the warehouse (fresh start)
    prompt: This deletes the ingested Iceberg warehouse. Continue?
    cmds:
      - docker compose --profile tools down -v

  checkpoint:save:
    desc: "Snapshot the Iceberg warehouse: task checkpoint:save -- step-1"
    cmds:
      - bash scripts/checkpoint.sh save {{.CLI_ARGS}}

  checkpoint:restore:
    desc: "Restore a warehouse snapshot: task checkpoint:restore -- step-1"
    cmds:
      - bash scripts/checkpoint.sh restore {{.CLI_ARGS}}

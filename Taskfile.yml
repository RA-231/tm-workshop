# Workshop task runner — https://taskfile.dev
# `task --list` shows everything; docs/ tells you when to run what.
version: '3'

tasks:
  setup:
    desc: Create .env and the local data directories
    cmds:
      - mkdir -p data/raw
      - cp -n .env.example .env || true
      - echo "ready — edit .env when you receive the workshop AWS credential"

  data:download:
    desc: "Download the ESA dataset: task data:download -- [small|medium|full]"
    cmds:
      - python3 scripts/fetch_esa_adb.py {{.CLI_ARGS | default "small"}}

  up:docs:
    desc: Build + serve the docs site and service landing page (http://localhost:4321)
    cmds:
      - docker compose up -d --build docs
      - echo "docs + service links -> http://localhost:4321"

  slides:
    desc: Serve the presenter slide deck (http://localhost:4321/slides/)
    cmds:
      # The deck is a static file under site/public, so the docs service serves it.
      - docker compose up -d --build docs
      - echo "slides -> http://localhost:4321/slides/   (press ? for controls, p for presenter view)"

  up:ingest:
    desc: Start the ingest stack (Garage, Polaris + Postgres, Flink)
    cmds:
      # Polaris pulls in its Postgres + one-shot bootstrap via depends_on.
      - docker compose up -d --build garage polaris flink-jobmanager flink-taskmanager
      - bash scripts/init-garage.sh

  data:prepare:
    desc: Convert the pickled ESA channels into JSON for Flink to read
    cmds:
      - docker compose run --rm --build prepare

  catalog:create:
    desc: Create the 'workshop' catalog in Polaris
    cmds:
      - bash scripts/create-catalog.sh

  flink:load:
    internal: true
    cmds:
      - docker compose exec -T flink-jobmanager bin/sql-client.sh -f /opt/flink/sql/ingest.sql
      - docker compose exec -T flink-jobmanager bin/sql-client.sh -f /opt/flink/sql/metadata.sql

  flink:job:
    desc: Load readings + metadata tables into Iceberg (Flink SQL)
    # No-op once the tables are in the catalog. The load SQL drops and
    # re-creates them, and Polaris purges the old data files in the background
    # — which stalls every catalog call for minutes. Use `task flink:reload`
    # to redo the load on purpose.
    status:
      - bash scripts/tables-loaded.sh
    cmds:
      - task: flink:load

  flink:reload:
    desc: Drop and re-load the Iceberg tables from scratch
    prompt: This re-creates the tables. Polaris purges the old data files in the background, which slows catalog operations for a few minutes. Continue?
    cmds:
      - task: flink:load

  trino:views:
    desc: Create the Trino views (enriched readings, anomalies, labeled_readings)
    cmds:
      - docker compose exec -T trino trino --catalog iceberg --schema esa_adb -f /etc/trino/views.sql

  up:query:
    desc: Start the query stack (Trino, Superset)
    cmds:
      - docker compose up -d --build --wait trino superset

  superset:dataset:
    desc: (Re)register the esa_adb.readings dataset in Superset
    cmds:
      - docker compose exec -T superset python /app/register_dataset.py

  trino:
    desc: Open an interactive Trino SQL session
    interactive: true
    cmds:
      - docker compose exec trino trino --catalog iceberg --schema esa_adb

  rowcount:
    desc: Count the rows ingested so far
    cmds:
      - docker compose up -d --wait trino
      - docker compose exec -T trino trino --execute "SELECT count(*) AS rows FROM iceberg.esa_adb.readings"

  bedrock:check:
    desc: Validate the AWS credential + config model IDs against Bedrock (read-only)
    cmds:
      - bash scripts/bedrock-check.sh

  up:chat:
    desc: Start the chat stack (Postgres, LiteLLM, MongoDB, LibreChat)
    cmds:
      - docker compose up -d litellm-postgres litellm mongodb librechat
      - echo "LibreChat -> http://localhost:3080  (register any account)"
      - echo "LiteLLM dashboard -> http://localhost:4000/ui  (admin / ${LITELLM_MASTER_KEY})"

  up:mcp:
    desc: Build + start the three MCP servers (esa-adb, trino, superset) and reload LibreChat
    cmds:
      - docker compose up -d --build mcp-server trino-mcp superset-mcp
      - docker compose restart librechat
      - echo "enable the esa-adb / trino / superset MCP servers in the agent's Tools menu"

  up:
    desc: Start the entire stack (all steps)
    cmds:
      - docker compose up -d --build
      - bash scripts/init-garage.sh

  down:
    desc: Stop all containers (data survives)
    cmds:
      - docker compose --profile tools down

  clean:
    desc: Stop everything and delete the warehouse (fresh start)
    prompt: This deletes the ingested Iceberg warehouse. Continue?
    cmds:
      - docker compose --profile tools down -v

  checkpoint:save:
    desc: "Snapshot the Iceberg warehouse: task checkpoint:save -- step-1"
    cmds:
      - bash scripts/checkpoint.sh save {{.CLI_ARGS}}

  checkpoint:restore:
    desc: "Restore a warehouse snapshot: task checkpoint:restore -- step-1"
    cmds:
      - bash scripts/checkpoint.sh restore {{.CLI_ARGS}}

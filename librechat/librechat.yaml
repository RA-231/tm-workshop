# LibreChat configuration for the workshop.
#
# One custom endpoint: LiteLLM, which fronts AWS Bedrock. LibreChat could
# talk to Bedrock directly, but routing through LiteLLM means the shared AWS
# credential lives in exactly one service and every client gets a plain
# OpenAI-compatible API. (See docs/03-chat.md for the full trade-off.)

version: 1.2.1
cache: true

# Step 4: our FastMCP server, giving the model tools against Trino.
# Enable it in the chat's tools menu after `task up:mcp`.
mcpServers:
  telemetry:
    type: streamable-http
    url: http://mcp-server:8000/mcp
    timeout: 30000

# LibreChat blocks MCP server URLs that resolve to private IPs (an SSRF guard)
# unless their domain is allow-listed here. Our server is reached at the compose
# service name `mcp-server` (a private-network address), so allow it. The bare
# hostname matches http://mcp-server:8000 regardless of port.
mcpSettings:
  allowedDomains:
    - "mcp-server"

interface:
  # Agents on: the Step-5 capstone builds a telemetry anomaly-analysis agent.
  agents: true
  prompts: false
  bookmarks: false

endpoints:
  custom:
    - name: "Workshop Models"
      apiKey: "${LITELLM_MASTER_KEY}"
      baseURL: "http://litellm:4000/v1"
      models:
        # fetch: true auto-discovers whatever LiteLLM exposes, so this list
        # just seeds the picker order. Keep it in sync with litellm/config.yaml.
        default: ["claude-sonnet-5", "claude-sonnet-4-6", "deepseek-r1", "gpt-oss-120b", "gpt-oss-20b"]
        fetch: true
      titleConvo: true
      titleModel: "claude-sonnet-5"
      modelDisplayLabel: "Bedrock (LiteLLM)"

# LibreChat configuration for the workshop.
#
# One custom endpoint: LiteLLM, the gateway. LibreChat could talk to the model
# provider directly, but routing through LiteLLM means your credential lives in
# exactly one service, every client gets the same OpenAI-compatible API, and
# budgets and spend tracking have somewhere to live.
# (See docs/03-chat.md for the full trade-off.)

version: 1.2.1
cache: true

# Step 4: our FastMCP server, giving the model tools against Trino.
# Enable it in the chat's tools menu after `task up:mcp`.
mcpServers:
  # Three focused servers the capstone agent composes (Step 5).
  esa-adb:                       # domain: telemetry nav + phase-aware detectors
    type: streamable-http
    url: http://mcp-server:8000/mcp
    timeout: 30000
  trino:                         # generic, dataset-agnostic Trino exploration
    type: streamable-http
    url: http://trino-mcp:8000/mcp
    timeout: 30000
  superset:                      # do-what-I-mean visualization
    type: streamable-http
    url: http://superset-mcp:8000/mcp
    timeout: 60000

# LibreChat blocks MCP server URLs that resolve to private IPs (an SSRF guard)
# unless their domain is allow-listed here. Our server is reached at the compose
# service name `mcp-server` (a private-network address), so allow it. The bare
# hostname matches http://mcp-server:8000 regardless of port.
mcpSettings:
  allowedDomains:
    - "mcp-server"
    - "trino-mcp"
    - "superset-mcp"

interface:
  # Agents on: the Step-5 capstone builds a telemetry anomaly-analysis agent.
  agents: true
  prompts: false
  bookmarks: false

endpoints:
  custom:
    - name: "Workshop Models"
      apiKey: "${LITELLM_MASTER_KEY}"
      baseURL: "http://litellm:4000/v1"
      models:
        # No list here on purpose: fetch: true asks LiteLLM what it serves, and
        # LiteLLM serves whatever your key can reach. Add or remove a model
        # upstream and the picker follows -- nothing in this repo to edit.
        default: ["workshop-default"]
        fetch: true
      titleConvo: true
      titleModel: "workshop-default"
      modelDisplayLabel: "Workshop Models"

# LiteLLM gateway config: one OpenAI-compatible endpoint in front of the
# workshop's model provider.
#
# Why a gateway at all? Your credential goes in exactly one place -- here -- and
# every client (LibreChat today, your scripts tomorrow) gets a plain OpenAI-style
# API with a master key you control, plus per-key budgets and spend tracking.
# That is the same shape a platform team runs in production.
#
# NO MODEL NAMES LIVE IN THIS FILE. The project your key belongs to is scoped to
# a set of models, and that set is the authority on what can be served -- it can
# change without notice. `task llm:check` prints what is actually available. The
# wildcard entry below forwards whatever the credential can reach, so a model
# added or removed upstream needs no edit here and shows up in LibreChat's picker
# on its next fetch.

model_list:
  # Everything the credential can reach, under its own name.
  - model_name: "*"
    litellm_params:
      model: openai/*
      api_key: os.environ/LLM_API_KEY

  # A stable alias the docs can name, so instructions stay correct when the
  # lineup changes. Which model it points at lives in .env, not here.
  #
  # Pick a model that can drive tools: Steps 4 and 5 need function calling, and
  # not every model in a project supports it on the chat-completions path --
  # some require extra parameters, some only expose tools on another endpoint.
  # `task llm:check` verifies the one you chose is still available.
  - model_name: workshop-default
    litellm_params:
      model: os.environ/WORKSHOP_DEFAULT_MODEL
      api_key: os.environ/LLM_API_KEY

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Let the dashboard persist models and virtual keys rather than reading this
  # file as the only source of truth.
  store_model_in_db: true

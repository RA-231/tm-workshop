# The whole workshop runs from this file. Services are added step by step —
# check the git tags (step-1 .. step-4) to see the stack grow.
#
# The Iceberg warehouse is the `warehouse` bucket in Garage (an S3-compatible
# object store). Polaris, Flink, and Trino all reach it at http://garage:3900
# with the same fixed key — see scripts/init-garage.sh.
name: tm-tutorial

services:
  # ── The workshop front door ───────────────────────────────────────────────
  # A Starlight docs site: the landing page links to every service below, and
  # the workshop guide (generated from docs/) is browsable at /overview etc.
  docs:
    build:
      context: .              # repo root, so the build can read docs/
      dockerfile: site/Dockerfile
    ports:
      - "4321:80"

  # ── Step 1: ingest ────────────────────────────────────────────────────────
  garage:
    image: dxflrs/garage:v2.3.0
    ports:
      - "3900:3900"   # S3 API
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

  # Polaris's metastore. Postgres (not the default in-memory store) is what
  # makes the catalog survive restarts — otherwise every `polaris` restart
  # forgets which tables exist, even though the data files remain in Garage.
  polaris-postgres:
    image: postgres:18.4-alpine3.23
    environment:
      POSTGRES_USER: polaris
      POSTGRES_PASSWORD: polaris
      POSTGRES_DB: POLARIS
    volumes:
      # Postgres 18 wants the mount at /var/lib/postgresql (it stores data in a
      # version subdirectory), not the older /var/lib/postgresql/data.
      - polaris-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polaris -d POLARIS"]
      interval: 3s
      timeout: 5s
      retries: 30

  # One-shot: create the Polaris schema + realm + root principal in Postgres.
  # Idempotent enough to re-run — see scripts note; runs before the server.
  polaris-bootstrap:
    image: apache/polaris-admin-tool:1.5.0
    # Wrap the admin tool so re-running on an already-bootstrapped DB (exit 3)
    # counts as success — otherwise every `up` after the first blocks Polaris.
    entrypoint: ["sh", "-c"]
    command:
      - |
        java -jar /deployments/polaris-admin-tool.jar bootstrap -r POLARIS -c POLARIS,root,s3cr3t
        code=$$?
        if [ $$code -eq 0 ] || [ $$code -eq 3 ]; then echo "bootstrap: exit $$code (ok)"; exit 0; fi
        echo "bootstrap failed: exit $$code"; exit $$code
    environment:
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://polaris-postgres:5432/POLARIS
      QUARKUS_DATASOURCE_USERNAME: polaris
      QUARKUS_DATASOURCE_PASSWORD: polaris
    depends_on:
      polaris-postgres:
        condition: service_healthy
    restart: "no"

  polaris:
    image: apache/polaris:1.5.0
    ports:
      - "8181:8181"
    environment:
      polaris.realm-context.realms: POLARIS
      # Persistent metastore in Postgres — the catalog outlives restarts.
      polaris.persistence.type: relational-jdbc
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://polaris-postgres:5432/POLARIS
      QUARKUS_DATASOURCE_USERNAME: polaris
      QUARKUS_DATASOURCE_PASSWORD: polaris
      # We use S3 (Garage) storage only. With the persistent metastore Polaris
      # runs production-readiness checks and aborts on the insecure FILE storage
      # type, so — unlike the old in-memory setup — we must NOT enable FILE.
      'polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES"': '["S3"]'
      # Let DROP TABLE purge data files, so re-running the (idempotent) Flink
      # load scripts can drop-and-recreate tables instead of erroring.
      'polaris.features."DROP_WITH_PURGE_ENABLED"': "true"
      # Polaris writes table metadata itself, so it needs the S3 key too.
      AWS_REGION: garage
      AWS_ACCESS_KEY_ID: GK31c2f218a2e44f485b94239e
      AWS_SECRET_ACCESS_KEY: 7d37d093435a41f2aab8f13c19ba067d9776c90215f56614adad6ece597dbb34
      # AWS SDK v2 ≥2.30 adds CRC32 upload trailers by default, which Garage
      # (and most S3-compatible stores) reject. Only checksum when required.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      # Polaris does its own S3 I/O: the metadata.json reads behind every
      # loadTable, and the background file deletes a DROP TABLE ... PURGE
      # queues. The AWS SDK's Apache pool defaults to 50 connections, which a
      # purge of a few hundred data files saturates — every other catalog call
      # then blocks on the 10s acquisition timeout and retries, so a plain
      # CREATE VIEW takes minutes instead of under a second. Give the pool room
      # and cap how many cleanup tasks compete for it at once.
      polaris.storage.max-http-connections: "200"
      polaris.tasks.max-concurrent-tasks: "4"
      quarkus.otel.sdk.disabled: "true"
    depends_on:
      garage:
        condition: service_started
      polaris-postgres:
        condition: service_healthy
      polaris-bootstrap:
        condition: service_completed_successfully

  flink-jobmanager:
    build: ./flink
    command: jobmanager
    ports:
      - "8081:8081"   # Flink UI
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 2g
      # Garage rejects the AWS SDK's default CRC32 upload trailers.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    volumes:
      - ./data/prepared:/data/prepared:ro   # the JSON the ingest job reads
      - ./flink/sql:/opt/flink/sql:ro        # edit SQL and re-run, no rebuild
    depends_on:
      - polaris

  flink-taskmanager:
    build: ./flink
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 4g
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    volumes:
      - ./data/prepared:/data/prepared:ro
    depends_on:
      - flink-jobmanager

  # ── Step 2: query ─────────────────────────────────────────────────────────
  trino:
    image: trinodb/trino:482
    ports:
      - "8080:8080"   # SQL + web UI
    environment:
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    volumes:
      - ./trino/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
      - ./trino/views.sql:/etc/trino/views.sql:ro
      - ./trino/optimize.sql:/etc/trino/optimize.sql:ro
    depends_on:
      - polaris
      - garage

  superset:
    build: ./superset
    ports:
      - "8088:8088"
    volumes:
      - superset-home:/app/superset_home   # persist metadata (dashboards, etc.)
    depends_on:
      - trino

  # ── Step 3: chat ──────────────────────────────────────────────────────────
  # LiteLLM's own metastore. The proxy answers /chat/completions without it,
  # but the dashboard's whole job — virtual keys, per-key budgets, spend
  # tracking — is stored here. Without a DATABASE_URL, /ui loads and
  # /key/generate returns "DB not connected".
  litellm-postgres:
    image: postgres:18.4-alpine3.23
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    volumes:
      # Postgres 18 wants the mount at /var/lib/postgresql, as with polaris-pg.
      - litellm-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 3s
      timeout: 5s
      retries: 30

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    # config.generated.yaml is written by scripts/render-litellm-config.py (run
    # by `task up:chat`) and holds the models your key can actually reach.
    command: ["--config", "/etc/litellm/config.generated.yaml"]
    ports:
      - "4000:4000"
    environment:
      # Your model credential lives HERE and nowhere else.
      LLM_API_KEY: ${LLM_API_KEY:-}
      WORKSHOP_DEFAULT_MODEL: ${WORKSHOP_DEFAULT_MODEL:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-workshop}
      DATABASE_URL: postgresql://litellm:litellm@litellm-postgres:5432/litellm
      # The dashboard signs in with the master key as the password.
      UI_USERNAME: ${LITELLM_UI_USERNAME:-admin}
      UI_PASSWORD: ${LITELLM_MASTER_KEY:-sk-workshop}
    volumes:
      # The directory, not the single file: a missing generated config then fails
      # loudly in the container instead of Docker creating a stray directory.
      - ./litellm:/etc/litellm:ro
    depends_on:
      litellm-postgres:
        condition: service_healthy

  mongodb:
    image: mongo:7
    command: mongod --quiet --logpath /dev/null
    volumes:
      - mongo-data:/data/db

  librechat:
    image: ghcr.io/danny-avila/librechat:v0.8.7
    ports:
      - "3080:3080"
    environment:
      HOST: 0.0.0.0
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-workshop}
      # Frictionless login: anyone can self-register on their own instance.
      ALLOW_REGISTRATION: "true"
      ALLOW_EMAIL_LOGIN: "true"
      ALLOW_UNVERIFIED_EMAIL_LOGIN: "true"
      # Fixed keys — fine for a local workshop instance, never for production.
      CREDS_KEY: f34be427ebb29de8d88c107a71546019685ed8b241d8f2ed00c3df97ad2566f0
      CREDS_IV: e2341419ec3dd3d19b13a1a87fafcbfb
      JWT_SECRET: 16f8c0ef4a5d391b26034086c628469d3f9f497f08163ab9b40137092f2909ef
      JWT_REFRESH_SECRET: eaa5191f2914e30b9387fd84e254e4ba6fc51b4654968a9b0803b456a54b8418
      ENDPOINTS: custom,agents
    volumes:
      - ./librechat/librechat.yaml:/app/librechat.yaml:ro
    depends_on:
      - mongodb
      - litellm

  # ── Step 4: MCP ───────────────────────────────────────────────────────────
  mcp-server:
    build: ./mcp-server
    ports:
      - "8000:8000"   # streamable-http MCP endpoint at /mcp
    environment:
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      TRINO_CATALOG: iceberg
      TRINO_SCHEMA: esa_adb
    depends_on:
      - trino

  # Generic, dataset-agnostic Trino explorer (query/list/describe any catalog).
  trino-mcp:
    build: ./trino-mcp
    ports:
      - "8001:8000"   # streamable-http MCP endpoint at /mcp
    environment:
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      TRINO_CATALOG: iceberg
    depends_on:
      - trino

  # Do-what-I-mean visualization: turns agent intent into Superset charts.
  superset-mcp:
    build: ./superset-mcp
    ports:
      - "8002:8000"   # streamable-http MCP endpoint at /mcp
    environment:
      SUPERSET_URL: http://superset:8088
      SUPERSET_USER: admin
      SUPERSET_PASSWORD: admin
      SUPERSET_DB_NAME: "Trino (Iceberg telemetry)"
      # The URL superset-mcp hands back to the agent as a chart link, so it
      # has to be reachable from the browser. In a Codespace that is the
      # forwarded https host, which .devcontainer/post-create.sh writes to .env.
      SUPERSET_PUBLIC_URL: ${SUPERSET_PUBLIC_URL:-http://localhost:8088}
      SUPERSET_SCHEMA: esa_adb
    depends_on:
      - superset

  # One-shot data prep: `task data:prepare` (docker compose run prepare).
  # Converts the pickled ESA channels into newline-delimited JSON that the
  # Flink ingest job reads.
  prepare:
    build: ./prepare
    profiles: ["tools"]
    environment:
      DATA_DIR: /data/raw
      OUT_DIR: /data/prepared
      LIMIT_PER_CHANNEL: "0"
    volumes:
      - ./data/raw:/data/raw:ro
      - ./data/medium:/data/medium:ro   # read only by `task data:prepare -- medium`
      - ./data/prepared:/data/prepared

volumes:
  litellm-pg:
  mongo-data:
  garage-meta:
  garage-data:
  superset-home:
  polaris-pg:

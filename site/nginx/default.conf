# Serve the built site. The only non-default setting is absolute_redirect off.
#
# nginx listens on 80 inside the container but is published on 4321, and it has
# no way to know that. With absolute redirects on (the default), a request for
# /creds -- a directory, so nginx redirects to /creds/ -- comes back as
# "Location: http://localhost/creds/", dropping the port. The browser then tries
# port 80 and fails. Relative redirects keep whatever host:port the client used.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    absolute_redirect off;
    port_in_redirect  off;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}

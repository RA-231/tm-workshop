# Serve the built site. The only non-default setting is absolute_redirect off.
#
# nginx listens on 80 inside the container but is published on 4321, and it has
# no way to know that. With absolute redirects on (the default), a request for
# /creds -- a directory, so nginx redirects to /creds/ -- comes back as
# "Location: http://localhost/creds/", dropping the port. The browser then tries
# port 80 and fails. Relative redirects keep whatever host:port the client used.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    absolute_redirect off;
    port_in_redirect  off;

    # Directory redirects are 302, not nginx's default 301. A 301 is cached by
    # browsers persistently -- if one is ever issued wrongly (as it was before
    # absolute_redirect was turned off, sending :4321 to port 80), the stale
    # redirect survives the server-side fix and has to be cleared by hand.
    # Nothing here benefits from a permanent redirect.
    location = /creds { return 302 /creds/; }
    location = /slides { return 302 /slides/; }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
